name: Mayham Accounts - Windows Installer
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Perl for vendored OpenSSL
        shell: pwsh
        run: |
          choco install strawberryperl -y --no-progress
          "C:\Strawberry\perl\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "C:\Strawberry\c\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Build Mayham Accounts setup installer
        env:
          MAYHAM_UPDATE_REPO: ${{ github.repository }}
          MAYHAM_UPDATE_PUBLIC_KEY: ${{ vars.MAYHAM_UPDATE_PUBLIC_KEY }}
        run: npm run tauri -- build --bundles nsis
      - name: Upload setup installer
        uses: actions/upload-artifact@v4
        with:
          name: Mayham-Accounts-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
